<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Recommendation Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="main-container">

    <div class="glass-card">

        <h1 class="hero-title">
            AI Recommendation Result
        </h1>

        <p class="hero-text mb-5">
            Intelligent agricultural recommendations generated
            using environmental and soil analysis.
        </p>

        <div class="result-box">
            {{ result | safe }}
        </div>

        <div class="button-group">

            <a href="/"
               class="primary-btn">
                Back
            </a>

            <a href="/history"
               class="secondary-btn">
                History
            </a>

        </div>

    </div>

</div>

</body>
</html>
